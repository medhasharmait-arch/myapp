# Search flow (specs/search.md): List -> type "red" -> only Mars -> open Mars.
# Android: maestro test -e APP_ID=com.myapp .maestro/search.yaml
# iOS:     maestro test -e APP_ID=com.myapp.ios .maestro/search.yaml
appId: ${APP_ID}
---
- launchApp
- tapOn: "See the planets"
- assertVisible: "Mercury"
- tapOn: "Search planets"
- inputText: "red"
- assertVisible: "Mars"
- assertNotVisible: "Mercury"
- assertNotVisible: "Jupiter"
- tapOn: "Mars"
- assertVisible: "The red planet"
- assertNotVisible: "Search planets"
